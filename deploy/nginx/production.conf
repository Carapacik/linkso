server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 32k;

    location ^~ /api/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_redirect off;
    }

    location ^~ /health/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location = /internal/metrics {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location ~ "^/[A-Za-z0-9][A-Za-z0-9_-]{2,63}$" {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_redirect off;
    }

    location = / {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location ^~ /app/ {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location ^~ /errors/ {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location ^~ /assets/ {
        include /etc/nginx/snippets/linkso-production-security.conf;
        # Stable resources can be reused for a day; names are not immutable.
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ^~ /canvaskit/ {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location ^~ /icons/ {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /favicon.png {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /main.dart.mjs {
        include /etc/nginx/snippets/linkso-production-security.conf;
        default_type application/javascript;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~ ^/(main\.dart\.(js|wasm)|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$ {
        include /etc/nginx/snippets/linkso-production-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
